services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: navis_docs
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    # BuildKit (default Docker 23+) enables the Dockerfile deps-stage pnpm store cache mount.
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_DEPLOY_MODE: self-hosted
    env_file:
      - .env
    environment:
      # Defaults match bundled db/redis; override in .env for external services
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:password@db:5432/navis_docs}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  db_data:
  redis_data:
